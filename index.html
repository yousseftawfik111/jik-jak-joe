<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1d1d1d" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Jik-Jak-Joe</title>
  </head>
  <body>
    <!-- Lobby Screen -->
    <div class="lobby" id="lobby">
      <h1>Jik-Jak-Joe</h1>
      <p class="subtitle">Ultimate Tic-Tac-Toe</p>

      <div class="lobby-buttons">
        <button id="create-room-btn" class="btn btn-primary">
          Create Room
        </button>
        <div class="divider">or</div>
        <div class="join-section">
          <input
            type="text"
            id="room-code-input"
            placeholder="Enter room code"
            maxlength="6"
            autocapitalize="characters"
          />
          <button id="join-room-btn" class="btn btn-secondary">Join</button>
        </div>
      </div>

      <p id="lobby-error" class="error-message"></p>
    </div>

    <!-- Waiting Room -->
    <div class="waiting-room hidden" id="waiting-room">
      <h2>Waiting for opponent...</h2>
      <div class="room-code-display">
        <span>Room Code:</span>
        <strong id="display-room-code"></strong>
        <button id="copy-code-btn" class="btn-icon" title="Copy code">
          📋
        </button>
      </div>
      <p class="hint">Share this code with your friend</p>
    </div>

    <!-- Game Screen -->
    <div class="game-screen hidden" id="game-screen">
      <div class="game-header">
        <div class="player-info">
          <span>You: <strong id="player-symbol"></strong></span>
          <span id="turn-indicator"></span>
        </div>
        <div class="play-again-section">
          <button id="play-again-btn" class="btn btn-small hidden">Play Again</button>
          <span id="play-again-status"></span>
        </div>
        <div class="room-info">Room: <strong id="game-room-code"></strong></div>
      </div>
      <div class="game-container"></div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
  </body>
</html>
