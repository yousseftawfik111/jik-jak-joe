<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./icons/icon-512.png"
    />
    <meta name="theme-color" content="#1d1d1d" />
    <title>Jik-Jak-Joe</title>
  </head>
  <body>
    <!-- Lobby Screen -->
    <div class="lobby" id="lobby">
      <h1>Jik-Jak-Joe</h1>

      <div class="lobby-buttons">
        <button id="create-room-btn" class="btn btn-primary">
          Create Room
        </button>
        <div class="divider">or</div>
        <div class="join-section">
          <input
            type="text"
            id="room-code-input"
            placeholder="Enter room code"
            maxlength="6"
            autocapitalize="characters"
          />
          <button id="join-room-btn" class="btn btn-secondary">Join</button>
        </div>
      </div>

      <p id="lobby-error" class="error-message"></p>
    </div>

    <!-- Waiting Room -->
    <div class="waiting-room hidden" id="waiting-room">
      <h2>Waiting for opponent...</h2>
      <div class="room-code-display">
        <span>Room Code:</span>
        <strong id="display-room-code"></strong>
        <button id="copy-code-btn" class="btn-icon" title="Copy code">
          📋
        </button>
      </div>
      <p class="hint">Share this code with your friend</p>
      <button id="leave-waiting-btn" class="btn btn-leave">Leave Room</button>
    </div>

    <!-- Game Screen -->
    <div class="game-screen hidden" id="game-screen">
      <div class="game-header">
        <div class="player-info">
          <span>You: <strong id="player-symbol"></strong></span>
          <span id="turn-indicator"></span>
        </div>
        <div class="play-again-section">
          <button id="play-again-btn" class="btn btn-small hidden">
            Play Again
          </button>
          <span id="play-again-status"></span>
        </div>
        <div class="room-info">
          <span>Room: <strong id="game-room-code"></strong></span>
          <button id="leave-room-btn" class="btn-leave-small" title="Leave room">✕</button>
        </div>
      </div>
      <div class="game-container"></div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
